[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Maria-Eduarda-Oliveira",email = "duda231723@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "sqlalchemy (>=2.1.5,<3.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx2 (>=2.13.1,<3.0.0)",
    "ruff (>=0.17.1,<0.18.0)"
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]