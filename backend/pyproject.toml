[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Maria-Eduarda-Oliveira",email = "duda231723@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.162.7,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.1.8,<3.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "httpx2 (>=2.16.0,<3.0.0)",
    "ruff (>=0.17.5,<0.18.0)"
]

[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]
