name: CI - Frontend

on:
  push:
    branches: [projeto-final]
    paths: ["frontend/**", "backend/**", ".github/workflows/ci-frontend.yml"]
  pull_request:
    branches: [main]
    paths: ["frontend/**", "backend/**", ".github/workflows/ci-frontend.yml"]

jobs:
  frontend:
    name: Biome, Vitest, Build e Playwright
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manutencao_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/manutencao_db
      CORS_ORIGINS: http://localhost:4173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install poetry
      - name: Instalar backend e aplicar migrations
        working-directory: backend
        run: |
          poetry install --no-interaction --no-ansi
          poetry run alembic upgrade head
      - name: Subir a API em segundo plano
        working-directory: backend
        run: |
          nohup poetry run uvicorn main:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          cat api.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verificacoes do frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run test
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Enviar relatorio do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7